application:
    package: dev.libr.immich
    version: 3.4.0
    lpk_sha256: 16871cf2eff4f6de8546f38716c0ef952b1b7e6bbce459768eafb47ede381a9c
    changelog: |-
        Upstream 3.4.0 (since 3.3.6)
        - chore: version v3.4.0
        - fix(server): bump backups to 1.14.0 to enable polling login (#33137)
        - fix(web): stale caches (#33136)
        - fix(server): disable passkeys (#33133)
        - fix(mobile): update sqlite_async to 0.14.8 (#33132)
        - fix: truncate filename in detail panel (#33130)
        - fix(web): more reactivity issues around `@const` (#33129)
        - fix: download archive filename handling for edited assets (#33128)
        - fix(web): handle album users being empty for shared links (#33127)
        - fix(mobile): don't block startup when offline (#33101)
        - chore: version v3.4.0-rc.3
        - feat(server): use Immich database for backups state (#33037)
        - fix: web import ordering (#33011)
        - chore: migrate server import sorting back to prettier (#33004)
        - refactor: web tests (#33008)
        - feat(mobile): passkeys (#33005)
        - fix(ml): include the error when a model fails to load (#33003)
        - chore(android): Build Flutter config before Fastlane builds (#33002)
        - feat: keyboard shortcuts for person page (#32992)
        - chore: version v3.4.0-rc.2
        - fix(mobile): log out before resetting the local database (#32982)
        - fix: asset viewer reactivity (#32979)
        - fix(web): smoother asset viewer gradients (#32977)
        - chore(web): refactor help and support modal (#32976)
        - fix(web): scroll memory (#32975)
        - fix(server): validate motion photo video range before extraction (#32972)
        - fix(server): read only valid ISO values (#32971)
        - fix(ml): disable onnxruntime telemetry (#32959)
        - fix: medium test flake (#32950)
        - fix: rate limits (#32945)
        - fix: people page websockets (#32942)
        - fix: web error handler (#32941)
        - fix: backups codegen (#32936)
        - fix: oauth regressions (#32937)
        - feat: web medium tests (#32879)
        - fix: web worker import (#32877)
        - fix: remove asset from album doesn't resize the timeline (#32875)
        - fix: font loading (#32874)
        - fix(server): keep ocr search text after edits and thumbnail regeneration (#32842)
        - fix(mobile): show 10-bit heic and avif originals on ios (#32841)
        - chore: version v3.4.0-rc.1
        - feat: futo backups 1.12.1 with restic's parallel scan (#32836)
        - fix(ci): release notes script (#32837)
        - fix(server): single library exclusion matcher (#32834)
        - fix(server): keep user motion files on embedded motion replace (#32833)
        - fix(server): live photo match library (#32832)
        - fix(server): compress database backups on 75% of the cores, up to 32 (#32828)
        - fix: breaking changes (#32826)
        - chore: version v3.4.0-rc.0
        - chore(web): update translations (#32256)
