application:
  subdomain: immich
  background_task: true
  multi_instance: false
  gpu_accel: true
  kvm_accel: false
  usb_accel: false
  public_path:
    - /
  routes:
    - /=http://immich.dev.libr.immich.lzcapp:2283/
services:
  immich:
    # upstream: ghcr.io/immich-app/immich-server:v3.4.0@sha256:8656fe4c1d096ff5de233082e0620b5aa6a921cff6d33505c9dde4a01a767b5e
    image: registry.lazycat.cloud/peter/immich-app/immich-server:1d5525fa8ecb77ae
    environment:
      - TZ=Asia/Shanghai
      - DB_HOSTNAME=postgres.dev.libr.immich.lzcapp
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=redis.dev.libr.immich.lzcapp
      - IMMICH_MACHINE_LEARNING_URL=http://machine-learning.dev.libr.immich.lzcapp:3003
    binds:
      - /lzcapp/var/photos:/data
  machine-learning:
    # upstream: ghcr.io/immich-app/immich-machine-learning:v3.4.0@sha256:0de2115c899b8c28a4348860c6ea0d24b7bb4622c85dec4f42481ec7d866e98b
    image: registry.lazycat.cloud/peter/immich-app/immich-machine-learning:7486e485a25c0b35
    environment:
      - MACHINE_LEARNING_WORKERS=1
      - MACHINE_LEARNING_WORKER_TIMEOUT=120
      - HF_ENDPOINT=https://hf-mirror.com
    binds:
      - /lzcapp/var/machine:/cache
  redis:
    # upstream: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    image: registry.lazycat.cloud/peter/valkey/valkey:a5138112a2382a4c
  postgres:
    # upstream: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    image: registry.lazycat.cloud/peter/immich-app/postgres:bacbe7b332150178
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    binds:
      - /lzcapp/var/data:/var/lib/postgresql/data
