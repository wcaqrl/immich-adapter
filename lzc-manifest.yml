application:
  subdomain: immich
  background_task: true
  multi_instance: false
  gpu_accel: true
  kvm_accel: false
  usb_accel: false
  public_path:
    - /
  routes:
    - /=http://immich.dev.libr.immich.lzcapp:2283/
services:
  immich:
    # upstream: ghcr.io/immich-app/immich-server:v3.3.4@sha256:647e695a9b193c34f747bb01a1f6257c8f8af14fa727e849b69b080cd153a1f0
    image: registry.lazycat.cloud/peter/immich-app/immich-server:0ba3ffd155886940
    environment:
      - TZ=Asia/Shanghai
      - DB_HOSTNAME=postgres.dev.libr.immich.lzcapp
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=redis.dev.libr.immich.lzcapp
      - IMMICH_MACHINE_LEARNING_URL=http://machine-learning.dev.libr.immich.lzcapp:3003
    binds:
      - /lzcapp/var/photos:/data
  machine-learning:
    # upstream: ghcr.io/immich-app/immich-machine-learning:v3.3.4@sha256:99aaf459a2403158ed5d5999c54f3512355ca87be5d419d2498556429db960d2
    image: registry.lazycat.cloud/peter/immich-app/immich-machine-learning:2e6dd4112cc80b47
    environment:
      - MACHINE_LEARNING_WORKERS=1
      - MACHINE_LEARNING_WORKER_TIMEOUT=120
      - HF_ENDPOINT=https://hf-mirror.com
    binds:
      - /lzcapp/var/machine:/cache
  redis:
    # upstream: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    image: registry.lazycat.cloud/peter/valkey/valkey:a5138112a2382a4c
  postgres:
    # upstream: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    image: registry.lazycat.cloud/peter/immich-app/postgres:bacbe7b332150178
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    binds:
      - /lzcapp/var/data:/var/lib/postgresql/data
